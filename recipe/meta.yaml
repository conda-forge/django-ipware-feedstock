{% set name = "django-ipware" %}
{% set version = "8.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 377cc7926ea377d8f544511b019cd32b28060e1c9caa3d0c43c3e5e923560f33

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-build-isolation

requirements:
  host:
    - pip
    - hatchling
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - django >=5.2
    - python-ipware >=4.1.0,<5

test:
  requires:
    - python {{ python_min }}
  imports:
    - ipware

about:
  home: https://pypi.org/project/django-ipware/
  summary: This is django-ipware, application to retrieve client's IP address.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - swainn
    - gagelarsen
